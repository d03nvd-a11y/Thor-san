# Multi-Camera Configuration
cameras:
  # Left eye (primary)
  left:
    index: 0
    name: "left_eye"
    resolution: [640, 480]
    fps: 30

  # Right eye (secondary)
  right:
    index: 2
    name: "right_eye"
    resolution: [640, 480]
    fps: 30

  # Optional: Top-down view
  overhead:
    index: 4
    name: "overhead"
    resolution: [640, 480]
    fps: 30
    enabled: false

# Binocular Vision Parameters (Human-like)
binocular:
  # Inter-pupillary distance (like human eyes: ~6.5cm)
  baseline_m: 0.065

  # Estimated focal length (pixels) - calibrate for actual cameras
  focal_length_px: 700.0

  # Feature extraction method
  feature_type: "orb"  # Options: "orb", "sift", "akaze"
  max_features: 500

  # Temporal fusion (visual memory)
  temporal_window: 10  # frames
  temporal_decay: 0.95

  # Visual attention
  use_attention: true
  attention_sigma: 50.0  # Gaussian spread (pixels)

  # Correspondence matching
  match_ratio_threshold: 0.75  # Lowe's ratio test
  min_match_confidence: 0.6
  epipolar_threshold: 1.0  # pixels

# Synchronization
sync:
  max_time_diff_ms: 50  # Maximum allowed time difference between frames
  buffer_size: 5  # Frame buffer per camera

# Auto-exposure and white balance
auto_adjust:
  enabled: true
  exposure_auto: true
  white_balance_auto: true
