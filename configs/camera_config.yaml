# RealSense D435i Configuration

realsense:
  # RGB stream
  rgb_width: 640
  rgb_height: 480
  rgb_fps: 30

  # Depth stream
  depth_width: 640
  depth_height: 480
  depth_fps: 30

  # Enable streams
  enable_rgb: true
  enable_depth: true
  enable_imu: false      # Enable for odometry/SLAM
  enable_infrared: false # Enable for low-light conditions

  # Post-processing (hardware accelerated!)
  enable_decimation: true      # Reduce depth resolution (faster)
  enable_spatial_filter: true  # Smooth depth spatially
  enable_temporal_filter: true # Reduce noise over time
  enable_hole_filling: true    # Fill missing depth values

  # Alignment
  align_depth_to_color: true   # Align depth to RGB frame

# Depth processing
depth:
  min_depth_m: 0.3  # Minimum valid depth (meters)
  max_depth_m: 3.0  # Maximum valid depth (meters)
  clip_range: true  # Clip values outside range

# Performance
performance:
  target_fps: 30
  use_gpu: true  # Use GPU for YOLO if available
